<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atelier</title>
    <meta name="description" content="Génération d'images open source, sans compte et sans quota." />
    <meta name="theme-color" content="#14120f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atelier" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Studio</p>
        <h1>Atelier</h1>
        <p class="lede">Application d’images. Installe-la, puis elle s’ouvre sans le navigateur.</p>
      </header>
      <button class="go" id="install" type="button">Installer l’application</button>
      <p class="note" id="install-help" hidden></p>
      <div class="layout">
        <section class="group">
          <label>Prompt<textarea id="prompt" maxlength="800">un renard roux dans une forêt enneigée, lumière dorée</textarea></label>
          <div class="group"><span>Style</span><div class="chips" id="styles"></div></div>
          <div class="group"><span>Effet</span><div class="chips" id="effects"></div></div>
          <div class="group"><span>Format</span><div class="chips" id="ratios"></div></div>
          <div class="group"><span>Résolution</span><div class="chips" id="resolutions"></div></div>
          <label>À éviter<input id="negative" maxlength="200" placeholder="texte, flou, filigrane" /></label>
          <button class="go" id="go" type="button">Générer</button>
          <p class="err" id="error" hidden></p>
          <p class="note">Gratuit, open source. Aucune clé API.</p>
        </section>
        <section class="group">
          <div class="frame" id="frame"><p class="note">L’image apparaîtra ici.</p></div>
          <button class="go" id="split" type="button" hidden>Séparer les calques</button>
          <div id="layers"></div>
          <div class="chips" id="moves" hidden></div>
          <button class="go" id="psd" type="button" hidden>Exporter le PSD</button>
          <p class="note">Chaque zone devient un calque, modifiable ici puis dans Photoshop.</p>
        </section>
      </div>
    </main>
    <script src="app.js"></script>
    <script src="install.js"></script>
  </body>
</html>
